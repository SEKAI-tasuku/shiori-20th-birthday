<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第16問</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 20px auto;
    }

    input {
      padding: 12px;
      font-size: 18px;
      width: 80%;
      max-width: 300px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
    }

    #clear {
      display: none;
      margin-top: 20px;
      font-size: 22px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      gap: 20px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      border: 1px solid white;
      padding: 12px 18px;
      border-radius: 5px;
      flex: 1;
    }

    .nav a:hover {
      background: white;
      color: #111;
    }

    #message {
      margin-top: 15px;
      color: #ff7777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>第16問</h1>

  <img src="IMG_8238.jpeg" alt="第16問">

  <h2>ゴール地点を漢字2文字で答えよ</h2>

  <div id="answerArea">

    <input
      type="text"
      id="answer"
      placeholder="答えを入力"
      autocomplete="off"
    >

    <br>

    <button onclick="checkAnswer()">回答する</button>

    <p id="message"></p>

  </div>

  <div id="clear">
    正解！
  </div>

  <div class="nav">
    <a href="question15.html">← 第15問へ戻る</a>
    <a href="hotel.html">ホテルへ進む →</a>
  </div>

</div>

<script>
  function checkAnswer() {
    const answer = document.getElementById("answer").value.trim();

    if (answer === "椿森") {
      localStorage.setItem("clear16", "true");
      showClear();
    } else {
      document.getElementById("message").textContent = "不正解！もう一度考えてみよう。";
    }
  }

  function showClear() {
    document.getElementById("clear").style.display = "block";
    document.getElementById("answerArea").style.display = "none";
  }

  window.addEventListener("pageshow", function() {
    if (localStorage.getItem("clear16") === "true") {
      showClear();
    }
  });
</script>

</body>
</html>
