<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第7問</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    img {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .question {
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      width: 80%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      box-sizing: border-box;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    button {
      display: block;
      margin: 0 auto;
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #wrong {
      color: #ff5555;
      margin-top: 20px;
      display: none;
    }

    #clear {
      display: none;
      margin-top: 25px;
      font-size: 22px;
    }

    .links {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    .links a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 20px;
      border: 1px solid white;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>第7問</h1>

  <img src="IMG_8231.jpeg" alt="第7問">

  <div class="question">
    ???に入る言葉を答えよ
  </div>

  <div id="answerArea">
    <input id="answer" type="text" placeholder="答えを入力">
    <button onclick="checkAnswer()">回答する</button>
    <div id="wrong">不正解！もう一度考えてみよう。</div>
  </div>

  <div id="clear">
    正解！<br>
    次の問題へ進もう！
  </div>

  <div class="links">
    <a href="question06.html">PREV</a>
    <a href="question08.html">NEXT</a>
  </div>

</div>

<script>
  function showClear() {
    document.getElementById("clear").style.display = "block";
    document.getElementById("answerArea").style.display = "none";
  }

  function checkAnswer() {
    const answer = document.getElementById("answer").value.trim();

    if (answer === "ロータス" || answer === "ろーたす" || answer.toLowerCase() === "lotus") {
      localStorage.setItem("clear07", "true");
      showClear();
    } else {
      document.getElementById("wrong").style.display = "block";
    }
  }

  window.addEventListener("pageshow", function() {
    if (localStorage.getItem("clear07") === "true") {
      showClear();
    }
  });
</script>

</body>
</html>
