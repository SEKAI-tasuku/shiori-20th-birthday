/* =========================================================
   ランダム順を作る
========================================================= */

function createRandomOrder() {

  let order = [];

  for (let i = 4; i <= 15; i++) {
    order.push(i);
  }

  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [order[i], order[j]] = [order[j], order[i]];
  }

  localStorage.setItem(
    "randomOrder",
    JSON.stringify(order)
  );

  return order;
}


function getRandomOrder() {

  const saved = localStorage.getItem("randomOrder");

  if (saved) {
    try {
      const order = JSON.parse(saved);

      if (
        Array.isArray(order) &&
        order.length === 12 &&
        order.every(n => n >= 4 && n <= 15)
      ) {
        return order;
      }
    } catch (e) {
      console.log(e);
    }
  }

  return createRandomOrder();
}


/* =========================================================
   ランダム問題の現在位置
========================================================= */

function getRandomPosition() {

  const order = getRandomOrder();

  const cleared = [];

  for (let i = 4; i <= 15; i++) {
    if (localStorage.getItem("clear" + String(i).padStart(2, "0")) === "true") {
      cleared.push(i);
    }
  }

  for (let i = 0; i < order.length; i++) {

    if (!cleared.includes(order[i])) {
      return {
        number: order[i],
        position: i,
        order: order
      };
    }

  }

  return null;
}


/* =========================================================
   クリア済みチェック
========================================================= */

function isCleared(number) {

  return localStorage.getItem(
    "clear" + String(number).padStart(2, "0")
  ) === "true";

}

/* =========================================================
   Q4〜Q15 ランダム
========================================================= */

function showRandomQuestion() {

  const current = getRandomPosition();

  if (!current) {
    showQ16();
    return;
  }

  const number = current.number;
  const data = randomQuestions[number];

  let images = "";

  if (data.image) {

    if (Array.isArray(data.image)) {

      data.image.forEach(src => {
        images += `<img src="${src}">`;
      });

    } else {

      images = `<img src="${data.image}">`;

    }

  }

  app.innerHTML = `

    <h1>謎解き</h1>

    ${images}

    ${
      data.question
        ? `<h2>${data.question}</h2>`
        : ""
    }

    <div id="answerArea">

      <input id="answer" type="text" autocomplete="off">

      <br>

      <button onclick="checkRandomAnswer(${number})">
        回答する
      </button>

      <p id="message"></p>

    </div>

    <div id="clearMessage">
      正解！
    </div>

  `;

  if (isCleared(number)) {
    showClearedOnly();
  }

}


function checkRandomAnswer(number) {

  const answer =
    document.getElementById("answer").value.trim();

  const correctAnswers =
    randomQuestions[number].answers;

  if (correctAnswers.includes(answer)) {

    localStorage.setItem(
      "clear" + String(number).padStart(2, "0"),
      "true"
    );

    showClearedOnly();

    setTimeout(() => {

      const next = getRandomPosition();

      if (next) {
        showRandomQuestion();
      } else {
        showQ16();
      }

    }, 700);

  } else {

    document.getElementById("message").textContent =
      "不正解！もう一度考えてみよう。";

  }

}

function checkFixedAnswer(number) {

  const answer =
    document.getElementById("answer").value.trim();

  const data = fixedQuestions[number];

  if (data.answers.includes(answer)) {

    localStorage.setItem(
      "clear" + String(number).padStart(2, "0"),
      "true"
    );

    showClearedOnly();

    setTimeout(() => {

      if (number === 17) {
        showQ18();
      }

      else if (number === 18) {
        showQ19();
      }

      else if (number === 19) {
        showQ20();

        showFinal();

    }, 700);

  } else {

    document.getElementById("message").textContent =
      "不正解！もう一度考えてみよう。";

  }

}

/* =========================================================
   正解表示
========================================================= */

function showClearedOnly() {

  const answerArea =
    document.getElementById("answerArea");

  const clearMessage =
    document.getElementById("clearMessage");

  if (answerArea) {
    answerArea.style.display = "none";
  }

  if (clearMessage) {
    clearMessage.style.display = "block";
  }

}


/* =========================================================
   ゲーム完全リセット
========================================================= */

function resetGame() {

  for (let i = 1; i <= 20; i++) {

    localStorage.removeItem(
      "clear" + String(i).padStart(2, "0")
    );

  }

  localStorage.removeItem("randomOrder");

  location.reload();

}


/* =========================================================
   ページを開いたときの開始地点
========================================================= */

function startGame() {

  /*
    まだQ1をクリアしていない
    → Q1から開始
  */

  if (!isCleared(1)) {
    showQ1();
    return;
  }


  /*
    Q1クリア済み、Q2未クリア
  */

  if (!isCleared(2)) {
    showQ2();
    return;
  }


  /*
    Q1・Q2クリア済み、Q3未クリア
  */

  if (!isCleared(3)) {
    showQ3();
    return;
  }


  /*
    Q4〜Q15の途中
  */

  const randomPosition = getRandomPosition();

  if (randomPosition) {
    showRandomQuestion();
    return;
  }


  /*
    Q4〜Q15全部クリア
  */

  if (!isCleared(16)) {
    showQ16();
    return;
  }


  /*
    Q16クリア後
  */

  if (!isCleared(17)) {
    showHotel();
    return;
  }


  if (!isCleared(18)) {
    showQ18();
    return;
  }


  if (!isCleared(19)) {
    showQ19();
    return;
  }


  if (!isCleared(20)) {
    showQ20();
    return;
  }


  /*
    全部クリア
  */

  showFinal();

}


/* =========================================================
   スタート
========================================================= */

startGame();

</script>
