<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しおりちゃん20歳の謎解き</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#fff;
    color:#222;
    text-align:center;
}

.container{
    max-width:700px;
    margin:0 auto;
    padding:30px 20px 60px;
}

.start-screen{
    min-height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.start-small{
    font-size:20px;
    margin-bottom:8px;
}

.start-to{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.start-title{
    font-size:36px;
    font-weight:bold;
    margin-bottom:30px;
}

.start-message{
    font-size:20px;
    line-height:2;
    margin-bottom:35px;
}

.start-button,
.next-button{
    display:block;
    width:220px;
    margin:20px auto 0;
    padding:14px;
    border:none;
    border-radius:40px;
    background:#222;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.question-number{
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
}

.question-text{
    font-size:22px;
    line-height:1.8;
    margin:25px 0;
    white-space:pre-line;
}

.question-image{
    max-width:100%;
    height:auto;
    display:block;
    margin:20px auto;
    border-radius:8px;
}

.answer-input{
    width:80%;
    max-width:400px;
    box-sizing:border-box;
    padding:14px;
    font-size:20px;
    border:1px solid #aaa;
    border-radius:8px;
    margin:20px auto 10px;
    text-align:center;
}

.answer-button{
    display:block;
    width:180px;
    margin:10px auto;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#555;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.back-button{
    display:block;
    width:160px;
    margin:12px auto 0;
    padding:11px;
    border:1px solid #aaa;
    border-radius:30px;
    background:white;
    color:#555;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:25px;
    min-height:40px;
}

.wrong{
    color:#d33;
    font-size:28px;
    font-weight:bold;
}

.correct{
    color:#16803c;
    font-size:28px;
    font-weight:bold;
}

.hotel{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hotel-title{
    font-size:32px;
    font-weight:bold;
    margin-bottom:30px;
}

.hotel-text{
    font-size:20px;
    line-height:2;
    white-space:pre-line;
}

.clear-title{
    font-size:42px;
    font-weight:bold;
    margin:40px 0 30px;
}

.clear-message{
    font-size:22px;
    line-height:2;
    white-space:pre-line;
}

.reset-button{
    display:block;
    width:220px;
    margin:35px auto 0;
    padding:14px;
    border:1px solid #aaa;
    border-radius:40px;
    background:white;
    color:#555;
    font-size:17px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

/* =========================
   問題データ
========================= */

const questions = {

1:{
    image:["IMG_8113.jpeg","IMG_8114.jpeg","IMG_8115.jpeg"],
    text:"①②⑤⑧ = ？？？",
    answers:["千葉公園","ちばこうえん"]
},

2:{
    image:["IMG_8208.jpeg"],
    text:"",
    answers:["6","６","6個","６個"]
},

3:{
    image:[],
    text:"名無しの色は「青緑」\n\nコーヒーの色は「？？？」",
    answers:["オレンジ","おれんじ","橙"]
},

4:{
    image:["IMG_8228.jpeg"],
    text:"",
    answers:["紅葉","こうよう","もみじ"]
},

5:{
    image:["IMG_8229.jpeg"],
    text:"👄は何色？",
    answers:["青","青色"]
},

6:{
    image:["IMG_8230.jpeg"],
    text:"病気の予防は上から何個目？",
    answers:["5","５","5個目","５個目"]
},

7:{
    image:["IMG_8231.jpeg"],
    text:"？？？に入る言葉を答えよ",
    answers:["ロータス","ろーたす","lotus"]
},

8:{
    image:["IMG_8232.jpeg"],
    text:"",
    answers:["ケヤキ","けやき","keyaki"]
},

9:{
    image:["IMG_8233.jpeg"],
    text:"",
    answers:["B","b"]
},

10:{
    image:[],
    text:"鶴と亀が休むのは何曜日？",
    answers:["水曜日","水曜","水曜定休"]
},

11:{
    image:["IMG_8234.jpeg"],
    text:"この図は何をアップさせるか。\n漢字3文字で答えよ",
    answers:["柔軟性"]
},

12:{
    image:["IMG_8235.jpeg"],
    text:"",
    answers:["左","左目"]
},

13:{
    image:["IMG_8236.jpeg"],
    text:"",
    answers:["芍薬","シャクヤク"]
},

14:{
    image:[],
    text:"タイムトンネルでつながっている過去は何時代？",
    answers:["縄文時代","縄文"]
},

15:{
    image:["IMG_8237.jpeg"],
    text:"",
    answers:["S","s"]
},

16:{
    image:["IMG_8238.jpeg"],
    text:"ゴール地点を漢字2文字で答えよ",
    answers:["椿森"]
},

17:{
    image:["IMG_8240.jpeg","IMG_8239.jpeg"],
    text:"同じツッコミを当てよ",
    answers:["こいでかいな","こいでかい"]
},

18:{
    image:[],
    text:"うける⋯18\n西千葉⋯98\n世界⋯88\n寝坊⋯？？？",
    answers:["11"]
},

19:{
    image:[],
    text:"にほかをうの、どんにか\n\n並び替えて名言を作れ",
    answers:["ほんのうに、かんどうを","本能に、感動を"]
},

20:{
    image:[],
    text:"タテ－たすく = 203\nタテ×たすく = 804204\nたすく＋しおり = 1806\n\nしおり = ？？？",
    answers:["1005"]
}

};


/* =========================
   ランダム問題用
========================= */

let randomOrder = [];
let randomPosition = 0;


/* =========================
   共通
========================= */

function render(content){
    document.getElementById("app").innerHTML = content;
}


function createRandomOrder(){

    const numbers = [];

    for(let i=4;i<=15;i++){
        numbers.push(i);
    }

    for(let i=numbers.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [numbers[i],numbers[j]]=[numbers[j],numbers[i]];
    }

    randomOrder=numbers;

    localStorage.setItem(
        "randomOrder",
        JSON.stringify(randomOrder)
    );
}


function loadRandomOrder(){

    const saved=localStorage.getItem("randomOrder");

    if(saved){
        randomOrder=JSON.parse(saved);
    }else{
        createRandomOrder();
    }
}


/* =========================
   スタート画面
========================= */

function showStart(){

    render(`

        <div class="start-screen">

            <div class="start-small">
                HAPPY BIRTHDAY
            </div>

            <div class="start-to">
                しおりちゃんへ
            </div>

            <div class="start-title">
                20歳の誕生日
            </div>

            <div class="start-message">
                20個の謎を準備しました！<br><br>

                グダグダかもだけど！<br>
                楽しんでくれたら最高だせ！<br><br>

                世界！
            </div>

            <button
                class="start-button"
                onclick="startFromBeginning()">
                START
            </button>

        </div>

    `);
}


/* =========================
   最初から開始
========================= */

function startFromBeginning(){

    for(let i=1;i<=20;i++){
        localStorage.removeItem(
            "clear"+String(i).padStart(2,"0")
        );
    }

    localStorage.removeItem("randomOrder");

    randomPosition=0;

    createRandomOrder();

    showQuestion(1);
}


/* =========================
   戻るボタン
========================= */

function backFromFixed(number){

    if(number===2){
        showQuestion(1);
    }

    else if(number===3){
        showQuestion(2);
    }

    else if(number===16){
        randomPosition=11;
        showRandomQuestion();
    }

    else if(number===17){
        showHotel();
    }

    else if(number===18){
        showQuestion(17);
    }

    else if(number===19){
        showQuestion(18);
    }

    else if(number===20){
        showQuestion(19);
    }
}


function backFromRandom(){

    if(randomPosition===0){

        showQuestion(3);

    }else{

        randomPosition--;

        showRandomQuestion();

    }
}


function backFromHotel(){

    showQuestion(16);

}


function backFromClear(){

    showQuestion(20);

}


/* =========================
   戻るボタンHTML
========================= */

function getFixedBackButton(number){

    if(number===1){
        return "";
    }

    return `
        <button
            class="back-button"
            onclick="backFromFixed(${number})">
            ← 戻る
        </button>
    `;
}


function getRandomBackButton(){

    return `
        <button
            class="back-button"
            onclick="backFromRandom()">
            ← 戻る
        </button>
    `;
}


/* =========================
   固定問題表示
========================= */

function showQuestion(number){

    const q=questions[number];

    let images="";

    q.image.forEach(src=>{
        images+=`
            <img
                class="question-image"
                src="${src}"
                alt="">
        `;
    });


    const key=
        "clear"+String(number).padStart(2,"0");

    const solved=
        !!localStorage.getItem(key);


    let answerArea="";

    if(!solved){

        answerArea=`

            <input
                id="answerInput"
                class="answer-input"
                type="text"
                placeholder="答えを入力">

            <button
                class="answer-button"
                onclick="checkFixedAnswer(${number})">
                回答する
            </button>

            <div
                id="result"
                class="result">
            </div>

        `;

    }else{

        answerArea=`

            <div class="result">

                <div class="correct">
                    正解！
                </div>

                <button
                    class="next-button"
                    onclick="nextFixed(${number})">
                    NEXT
                </button>

            </div>

        `;

    }


    render(`

        <div>

            <div class="question-number">
                第${number}問
            </div>

            ${images}

            <div class="question-text">
                ${q.text}
            </div>

            ${answerArea}

            ${getFixedBackButton(number)}

        </div>

    `);
}


/* =========================
   固定問題の回答
========================= */

function checkFixedAnswer(number){

    const input=
        document.getElementById("answerInput");

    if(!input) return;

    const answer=
        input.value.trim();

    const q=
        questions[number];

    const correct=
        q.answers.some(
            a=>a.toLowerCase()===answer.toLowerCase()
        );


    const result=
        document.getElementById("result");


    if(correct){

        localStorage.setItem(
            "clear"+String(number).padStart(2,"0"),
            "true"
        );

        result.innerHTML=`

            <div class="correct">
                正解！
            </div>

            <button
                class="next-button"
                onclick="nextFixed(${number})">
                NEXT
            </button>

        `;

    }else{

        result.innerHTML=`

            <div class="wrong">
                不正解！
            </div>

        `;

    }

}


/* =========================
   固定問題 NEXT
========================= */

function nextFixed(number){

    if(number===1){

        showQuestion(2);

    }

    else if(number===2){

        showQuestion(3);

    }

    else if(number===3){

        randomPosition=0;

        showRandomQuestion();

    }

    else if(number===16){

        showHotel();

    }

    else if(number===17){

        showQuestion(18);

    }

    else if(number===18){

        showQuestion(19);

    }

    else if(number===19){

        showQuestion(20);

    }

    else if(number===20){

        showClear();

    }

}


/* =========================
   ランダム問題表示
========================= */

function showRandomQuestion(){

    loadRandomOrder();

    const actualNumber=
        randomOrder[randomPosition];

    const displayNumber=
        randomPosition+4;

    const q=
        questions[actualNumber];


    let images="";

    q.image.forEach(src=>{

        images+=`

            <img
                class="question-image"
                src="${src}"
                alt="">

        `;

    });


    const key=
        "clear"+String(actualNumber).padStart(2,"0");

    const solved=
        !!localStorage.getItem(key);


    let answerArea="";


    if(!solved){

        answerArea=`

            <input
                id="randomAnswerInput"
                class="answer-input"
                type="text"
                placeholder="答えを入力">

            <button
                class="answer-button"
                onclick="checkRandomAnswer()">
                回答する
            </button>

            <div
                id="randomResult"
                class="result">
            </div>

        `;

    }else{

        answerArea=`

            <div
                id="randomResult"
                class="result">

                <div class="correct">
                    正解！
                </div>

                <button
                    class="next-button"
                    onclick="nextRandom()">
                    NEXT
                </button>

            </div>

        `;

    }


    render(`

        <div>

            <div class="question-number">
                第${displayNumber}問
            </div>

            ${images}

            <div class="question-text">
                ${q.text}
            </div>

            ${answerArea}

            ${getRandomBackButton()}

        </div>

    `);

}


/* =========================
   ランダム問題 回答
========================= */

function checkRandomAnswer(){

    const input=
        document.getElementById("randomAnswerInput");

    if(!input) return;


    const answer=
        input.value.trim();

    const actualNumber=
        randomOrder[randomPosition];

    const q=
        questions[actualNumber];


    const correct=
        q.answers.some(
            a=>a.toLowerCase()===answer.toLowerCase()
        );


    const result=
        document.getElementById("randomResult");


    if(correct){

        localStorage.setItem(
            "clear"+String(actualNumber).padStart(2,"0"),
            "true"
        );


        result.innerHTML=`

            <div class="correct">
                正解！
            </div>

            <button
                class="next-button"
                onclick="nextRandom()">
                NEXT
            </button>

        `;

    }else{

        result.innerHTML=`

            <div class="wrong">
                不正解！
            </div>

        `;

    }

}


/* =========================
   ランダム問題 NEXT
========================= */

function nextRandom(){

    const actualNumber=
        randomOrder[randomPosition];


    const key=
        "clear"+String(actualNumber).padStart(2,"0");


    if(!localStorage.getItem(key)){
        return;
    }


    randomPosition++;


    if(randomPosition<12){

        showRandomQuestion();

    }else{

        showQuestion(16);

    }

}


/* =========================
   ホテルページ
========================= */

function showHotel(){

    render(`

        <div class="hotel">

            <div class="hotel-title">
                HOTEL
            </div>

            <div class="hotel-text">
                ここからホテルへ向かおう！

                次の謎はホテルで待っています。
            </div>

            <button
                class="next-button"
                onclick="showQuestion(17)">
                NEXT
            </button>

            <button
                class="back-button"
                onclick="backFromHotel()">
                ← 戻る
            </button>

        </div>

    `);

}


/* =========================
   CLEAR
========================= */

function showClear(){

    render(`

        <div>

            <div class="clear-title">
                CLEAR!
            </div>

            <div class="clear-message">
                20個の謎、すべてクリア！

                しおりちゃん
                20歳の誕生日おめでとう！

                世界より
            </div>

            <button
                class="back-button"
                onclick="backFromClear()">
                ← 戻る
            </button>

            <button
                class="reset-button"
                onclick="resetGame()">
                最初からやり直す
            </button>

        </div>

    `);

}


/* =========================
   リセット
========================= */

function resetGame(){

    for(let i=1;i<=20;i++){

        localStorage.removeItem(
            "clear"+String(i).padStart(2,"0")
        );

    }

    localStorage.removeItem("randomOrder");

    randomPosition=0;
    randomOrder=[];

    showStart();

}


/* =========================
   初期画面
========================= */

showStart();

</script>

</body>
</html>
