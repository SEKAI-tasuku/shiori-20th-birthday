<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>しおり20歳の謎解き</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f3ea;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.container {
  width: min(92%, 700px);
  margin: 0 auto;
  padding: 45px 0 60px;
  text-align: center;
}

.card {
  background: #fff;
  border-radius: 24px;
  padding: 40px 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* =========================
   スタート画面
========================= */

.start-title {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 35px;
  letter-spacing: 0.08em;
}

.start-message {
  font-size: 19px;
  line-height: 2.1;
  margin-bottom: 45px;
}

.start-button {
  width: 220px;
  padding: 16px;
  border: none;
  border-radius: 50px;
  background: #333;
  color: white;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.15em;
  cursor: pointer;
}

.start-button:active {
  transform: scale(0.97);
}

/* =========================
   問題
========================= */

.question-number {
  font-size: 18px;
  color: #888;
  margin-bottom: 20px;
}

.question-text {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.8;
  margin: 20px 0 30px;
}

.question-image {
  width: 100%;
  max-width: 600px;
  height: auto;
  display: block;
  margin: 15px auto 25px;
  border-radius: 12px;
}

.answer-input {
  width: 100%;
  max-width: 400px;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
}

.answer-button,
.next-button {
  display: block;
  width: 200px;
  margin: 15px auto 0;
  padding: 13px;
  border: none;
  border-radius: 30px;
  background: #333;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.result {
  margin-top: 25px;
  font-size: 22px;
  font-weight: bold;
}

.correct {
  color: #333;
}

.wrong {
  color: #c44;
}

/* =========================
   ホテル
========================= */

.hotel-title {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 35px;
}

.hotel-text {
  font-size: 18px;
  line-height: 2.1;
}

/* =========================
   CLEAR
========================= */

.clear-title {
  font-size: 32px;
  font-weight: bold;
  line-height: 1.6;
}

.clear-message {
  font-size: 18px;
  line-height: 2;
  margin-top: 30px;
}

.reset-button {
  display: block;
  width: 220px;
  margin: 40px auto 0;
  padding: 13px;
  border: 1px solid #aaa;
  border-radius: 30px;
  background: white;
  color: #555;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div id="app"></div>
</div>

<script>

/* =====================================================
   固定問題
===================================================== */

const fixedQuestions = {

    ]
  },

  3: {
    images: [],
    text: `
      名無しの色は「青緑」<br><br>

    `,

  },

  16: {

      "IMG_8238.jpeg"
    ],

    answers: [
      "椿森"
    ]
  },

  17: {
    images: [
      "IMG_8240.jpeg",
      "IMG_8239.jpeg"
    ],
    text: "同じツッコミを当てよ",
    answers: [

      "こいでかい"
    ]
  },

  18: {

      うける⋯18<br>

    `,

    ]

    ]

};


/* =====================================================
   ランダム問題 Q4〜15
===================================================== */

const randomQuestions = {

  4: {
    images: [
      "IMG_8228.jpeg"
    ],
    text: "",
    answers: [
      "紅葉",
      "こうよう",
      "もみじ"
    ]
  },

  5: {
    images: [
      "IMG_8229.jpeg"
    ],
    text: "👄は何色？",
    answers: [
      "青",
      "青色"
    ]
  },

  6: {
    images: [
      "IMG_8230.jpeg"
    ],
    text: "病気の予防は上から何個目？",
    answers: [
      "5",
      "５",
      "5個目",
      "５個目"
    ]
  },

  7: {
    images: [
      "IMG_8231.jpeg"
    ],
    text: "？？？に入る言葉を答えよ",
    answers: [
      "ロータス",
      "ろーたす",
      "lotus"
    ]
  },

  8: {
    images: [
      "IMG_8232.jpeg"
    ],
    text: "",
    answers: [
      "ケヤキ",
      "けやき",
      "keyaki"
    ]
  },

  9: {
    images: [
      "IMG_8233.jpeg"
    ],
    text: "",
    answers: [
      "B",
      "b"
    ]
  },

  10: {
    images: [],
    text: "鶴と亀が休むのは何曜日？",
    answers: [
      "水曜日",
      "水曜",
      "水曜定休"
    ]
  },

  11: {
    images: [
      "IMG_8234.jpeg"
    ],
    text: "この図は何をアップさせるか。漢字3文字で答えよ",
    answers: [
      "柔軟性"
    ]
  },

  12: {
    images: [
      "IMG_8235.jpeg"
    ],
    text: "",
    answers: [
      "左",
      "左目"
    ]
  },

  13: {
    images: [
      "IMG_8236.jpeg"
    ],
    text: "",
    answers: [
      "芍薬",
      "シャクヤク"
    ]
  },

  14: {
    images: [],
    text: "タイムトンネルでつながっている過去は何時代？",
    answers: [
      "縄文時代",
      "縄文"
    ]
  },

  15: {
    images: [
      "IMG_8237.jpeg"
    ],
    text: "",
    answers: [
      "S",
      "s"
    ]
  }

};


/* =====================================================
   変数
===================================================== */

let randomOrder = [];
let randomPosition = 0;


/* =====================================================
   画面描画
===================================================== */

function render(html) {

  document.getElementById("app").innerHTML = `
    <div class="card">
      ${html}
    </div>
  `;

}


/* =====================================================
   スタート画面
===================================================== */

function showStart() {

  render(`

    <div class="start-title">
      しおりちゃんへ
    </div>

    <div class="start-message">

      20歳の誕生日<br>
      20個の謎を準備しました！<br><br>

      グダグダかもだけど！<br>
      楽しんでくれたら最高だせ！<br><br>

      世界！

    </div>

    <button
      class="start-button"
      onclick="beginGame()"
    >
      START
    </button>

  `);

}


/* =====================================================
   STARTボタン
===================================================== */

function beginGame() {

  /*
    STARTを押したら必ず最初から。

    以前のクリア状況を全部削除する。
  */

  for (let i = 1; i <= 20; i++) {

    localStorage.removeItem(
      "clear" + String(i).padStart(2, "0")
    );

  }


  /*
    ランダム順もリセット。
  */

  localStorage.removeItem("randomOrder");

  randomOrder = [];
  randomPosition = 0;


  /*
    新しいランダム順を作る。
  */

  createRandomOrder();


  /*
    必ずQ1へ。
  */

  showQuestion(1);

}


/* =====================================================
   ランダム順を作る
===================================================== */

function createRandomOrder() {

  randomOrder =
    Object.keys(randomQuestions)
      .map(Number);


  /*
    Fisher-Yatesシャッフル
  */

  for (
    let i = randomOrder.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      randomOrder[i],
      randomOrder[j]
    ] = [
      randomOrder[j],
      randomOrder[i]
    ];

  }


  localStorage.setItem(
    "randomOrder",
    JSON.stringify(randomOrder)
  );

}


/* =====================================================
   通常問題表示
===================================================== */

function showQuestion(number) {

  const q =
    fixedQuestions[number];

  let images = "";

  q.images.forEach(src => {

    images += `
      <img
        src="${src}"
        class="question-image"
      >
    `;

  });


  render(`

    <div class="question-number">
      Q${number}
    </div>

    ${images}

    <div class="question-text">
      ${q.text}
    </div>

    <input
      id="answer"
      class="answer-input"
      type="text"
      autocomplete="off"
      placeholder="答えを入力"
    >

    <button
      class="answer-button"
      onclick="checkAnswer(${number})"
    >
      回答する
    </button>

    <div id="result"></div>

  `);

}


/* =====================================================
   通常問題の回答
===================================================== */

function checkAnswer(number) {

  const input =
    document.getElementById("answer");

  const answer =
    input.value.trim();

  const q =
    fixedQuestions[number];

  const correct =
    q.answers.some(
      a =>
        a.toLowerCase() ===
        answer.toLowerCase()
    );


  const result =
    document.getElementById("result");


  if (!correct) {

    result.innerHTML = `

      <div class="result wrong">
        不正解！
      </div>

    `;

    return;

  }


  /*
    正解を保存
  */

  localStorage.setItem(
    "clear" +
    String(number).padStart(2, "0"),
    "true"
  );


  result.innerHTML = `

    <div class="result correct">
      正解！
    </div>

    <button
      class="next-button"
      onclick="nextFixedQuestion(${number})"
    >
      NEXT
    </button>

  `;

}


/* =====================================================
   固定問題NEXT
===================================================== */

function nextFixedQuestion(number) {

  if (number === 1) {
    showQuestion(2);
    return;
  }

  if (number === 2) {
    showQuestion(3);
    return;
  }

  if (number === 3) {

    randomPosition = 0;

    showRandomQuestion();

    return;
  }

  if (number === 16) {

    showHotel();

    return;
  }

  if (number === 17) {

    showQuestion(18);

    return;
  }

  if (number === 18) {

    showQuestion(19);

    return;
  }

  if (number === 19) {

    showQuestion(20);

    return;
  }

  if (number === 20) {

    showClear();

    return;
  }

}


/* =====================================================
   ランダム問題表示
===================================================== */

function showRandomQuestion() {

  /*
    保存されているランダム順を使用
  */

  const saved =
    localStorage.getItem("randomOrder");


  if (saved) {

    randomOrder =
      JSON.parse(saved);

  } else {

    createRandomOrder();

  }


  /*
    ランダム問題の内部番号
  */

  const actualNumber =
    randomOrder[randomPosition];


  /*
    表示する番号は必ず4〜15
  */

  const displayedNumber =
    randomPosition + 4;


  const q =
    randomQuestions[actualNumber];


  let images = "";


  q.images.forEach(src => {

    images += `
      <img
        src="${src}"
        class="question-image"
      >
    `;

  });


  render(`

    <div class="question-number">
      Q${displayedNumber}
    </div>

    ${images}

    <div class="question-text">
      ${q.text}
    </div>

    <input
      id="randomAnswer"
      class="answer-input"
      type="text"
      autocomplete="off"
      placeholder="答えを入力"
    >

    <button
      class="answer-button"
      onclick="checkRandomAnswer()"
    >
      回答する
    </button>

    <div id="randomResult"></div>

  `);

}


/* =====================================================
   ランダム問題の回答
===================================================== */

function checkRandomAnswer() {

  const input =
    document.getElementById("randomAnswer");

  const answer =
    input.value.trim();


  const actualNumber =
    randomOrder[randomPosition];


  const q =
    randomQuestions[actualNumber];


  const correct =
    q.answers.some(
      a =>
        a.toLowerCase() ===
        answer.toLowerCase()
    );


  const result =
    document.getElementById("randomResult");


  /*
    ★ 不正解の場合 ★

    NEXTを絶対に出さない。
  */

  if (!correct) {

    result.innerHTML = `

      <div class="result wrong">
        不正解！
      </div>

    `;

    return;

  }


  /*
    ★ 正解の場合 ★
  */

  localStorage.setItem(
    "clear" +
    String(actualNumber).padStart(2, "0"),
    "true"
  );


  result.innerHTML = `

    <div class="result correct">
      正解！
    </div>

    <button
      class="next-button"
      onclick="nextRandomQuestion()"
    >
      NEXT
    </button>

  `;

}


/* =====================================================
   ランダム問題NEXT
===================================================== */

function nextRandomQuestion() {

  /*
    現在の問題が本当に正解済みか確認。
    これで不正解状態からNEXTを直接実行されても進まない。
  */

  const actualNumber =
    randomOrder[randomPosition];


  const key =
    "clear" +
    String(actualNumber).padStart(2, "0");


  if (!localStorage.getItem(key)) {

    return;

  }


  /*
    次のランダム問題へ
  */

  randomPosition++;


  if (randomPosition < 12) {

    showRandomQuestion();

    return;

  }


  /*
    Q4〜Q15終了
  */

  showQuestion(16);

}


/* =====================================================
   ホテル
===================================================== */

function showHotel() {

  render(`

    <div class="hotel-title">
      おつかれさま！
    </div>

    <div class="hotel-text">

      街ブラ謎解きはここまで！<br><br>

      椿森ホテルを予約してあります。<br><br>

      ここからは少し休憩して、<br>
      楽しい時間とご飯をゆっくり楽しもう！<br><br>

      まだまだ20歳の誕生日は終わりません。

    </div>

    <button
      class="next-button"
      onclick="showQuestion(17)"
    >
      NEXT
    </button>

  `);

}


/* =====================================================
   CLEAR
===================================================== */

function showClear() {

  render(`

    <div class="clear-title">

      20個の謎<br>
      撃破！<br><br>

      20歳！<br><br>

      HAPPY BIRTHDAY！

    </div>

    <div class="clear-message">

      誕生日おめでとう！<br><br>

      ここまでの20個の謎、<br>
      すべてクリア！<br><br>

      20歳の一年が、<br>
      たくさんの笑顔と<br>
      たくさんの思い出で<br>
      いっぱいになりますように。<br><br>

      これからもよろしくね。

    </div>

    <button
      class="reset-button"
      onclick="resetGame()"
    >
      最初からやり直す
    </button>

  `);

}


/* =====================================================
   最初からやり直す
===================================================== */

function resetGame() {

  /*
    全問題のクリア状態を削除
  */

  for (let i = 1; i <= 20; i++) {

    localStorage.removeItem(
      "clear" + String(i).padStart(2, "0")
    );

  }


  /*
    ランダム順も削除
  */

  localStorage.removeItem("randomOrder");


  randomOrder = [];
  randomPosition = 0;


  /*
    ★ 必ずスタート画面へ ★
  */

  showStart();

}


/* =====================================================
   重要
=====================================================

   start.htmlを開いたときは、
   絶対にQ1を表示しない。

   必ずスタート画面から始める。
===================================================== */

showStart();

</script>

</body>
</html>
