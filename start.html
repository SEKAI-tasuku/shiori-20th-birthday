<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>しおり20歳の謎解き</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f7f3ea;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

.container {
  width: min(92%, 700px);
  margin: 0 auto;
  padding: 45px 0 60px;
  text-align: center;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 35px 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.start-title {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 0.08em;
  margin-bottom: 30px;
}

.start-subtitle {
  font-size: 18px;
  line-height: 2;
  margin-bottom: 40px;
}

.start-button {
  width: 220px;
  padding: 16px;
  border: none;
  border-radius: 50px;
  background: #333;
  color: white;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.15em;
  cursor: pointer;
}

.start-button:active {
  transform: scale(0.97);
}

.question-number {
  font-size: 18px;
  color: #888;
  margin-bottom: 15px;
}

.question-text {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.8;
  margin: 20px 0 30px;
}

.question-image {
  width: 100%;
  max-width: 600px;
  height: auto;
  border-radius: 12px;
  margin: 10px auto 25px;
  display: block;
}

.answer-area {
  margin-top: 20px;
}

.answer-input {
  width: 100%;
  max-width: 400px;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  text-align: center;
}

.answer-button,
.next-button,
.back-button {
  display: block;
  width: 200px;
  margin: 15px auto 0;
  padding: 13px;
  border: none;
  border-radius: 30px;
  background: #333;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.back-button {
  background: #aaa;
}

.result {
  margin-top: 25px;
  font-size: 22px;
  font-weight: bold;
}

.correct {
  color: #333;
}

.wrong {
  color: #c44;
}

.hotel-title {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 30px;
}

.hotel-text {
  font-size: 18px;
  line-height: 2;
}

.clear-title {
  font-size: 34px;
  font-weight: bold;
  line-height: 1.5;
}

.clear-message {
  font-size: 18px;
  line-height: 2;
  margin-top: 30px;
}

.reset-button {
  display: block;
  width: 220px;
  margin: 35px auto 0;
  padding: 13px;
  border: 1px solid #999;
  border-radius: 30px;
  background: white;
  color: #555;
  font-size: 16px;
  cursor: pointer;
}

.nav {
  margin-top: 30px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">
  <div id="app"></div>
</div>

<script>

/* =========================================================
   問題データ
========================================================= */

const fixedQuestions = {

  1: {
    images: [
      "IMG_8113.jpeg",
      "IMG_8114.jpeg",
      "IMG_8115.jpeg"
    ],
    text: "①②⑤⑧ = ？？？",
    answers: ["千葉公園", "ちばこうえん"]
  },

  2: {
    images: ["IMG_8208.jpeg"],
    text: "",
    answers: ["6", "６", "6個", "６個"]
  },

  3: {
    images: [],
    text: `
      名無しの色は「青緑」<br><br>
      コーヒーの色は「？？？」
    `,
    answers: ["オレンジ", "おれんじ", "橙"]
  },

  16: {
    images: ["IMG_8238.jpeg"],
    text: "ゴール地点を漢字2文字で答えよ",
    answers: ["椿森"]
  },

  17: {
    images: [
      "IMG_8240.jpeg",
      "IMG_8239.jpeg"
    ],
    text: "同じツッコミを当てよ",
    answers: ["こいでかいな", "こいでかい"]
  },

  18: {
    images: [],
    text: `
      うける⋯18<br>
      西千葉⋯98<br>
      世界⋯88<br>
      寝坊⋯？？？
    `,
    answers: ["11"]
  },

  19: {
    images: [],
    text: `
      にほかをうの、どんにか<br><br>
      並び替えて名言を作れ
    `,
    answers: ["ほんのうに、かんどうを", "本能に、感動を"]
  },

  20: {
    images: [],
    text: `
      タテ－たすく = 203<br>
      タテ×たすく = 804204<br>
      たすく＋しおり = 1806<br><br>
      しおり = ？？？
    `,
    answers: ["1005"]
  }

};


/* =========================================================
   ランダム問題 Q4〜15
========================================================= */

const randomQuestions = {

  4: {
    images: ["IMG_8228.jpeg"],
    text: "",
    answers: ["紅葉", "こうよう", "もみじ"]
  },

  5: {
    images: ["IMG_8229.jpeg"],
    text: "👄は何色？",
    answers: ["青", "青色"]
  },

  6: {
    images: ["IMG_8230.jpeg"],
    text: "病気の予防は上から何個目？",
    answers: ["5", "５", "5個目", "５個目"]
  },

  7: {
    images: ["IMG_8231.jpeg"],
    text: "？？？に入る言葉を答えよ",
    answers: ["ロータス", "ろーたす", "lotus"]
  },

  8: {
    images: ["IMG_8232.jpeg"],
    text: "",
    answers: ["ケヤキ", "けやき", "keyaki"]
  },

  9: {
    images: ["IMG_8233.jpeg"],
    text: "",
    answers: ["B", "b"]
  },

  10: {
    images: [],
    text: "鶴と亀が休むのは何曜日？",
    answers: ["水曜日", "水曜", "水曜定休"]
  },

  11: {
    images: ["IMG_8234.jpeg"],
    text: "この図は何をアップさせるか。漢字3文字で答えよ",
    answers: ["柔軟性"]
  },

  12: {
    images: ["IMG_8235.jpeg"],
    text: "",
    answers: ["左", "左目"]
  },

  13: {
    images: ["IMG_8236.jpeg"],
    text: "",
    answers: ["芍薬", "シャクヤク"]
  },

  14: {
    images: [],
    text: "タイムトンネルでつながっている過去は何時代？",
    answers: ["縄文時代", "縄文"]
  },

  15: {
    images: ["IMG_8237.jpeg"],
    text: "",
    answers: ["S", "s"]
  }

};


/* =========================================================
   状態管理
========================================================= */

let randomOrder = [];
let randomPosition = 0;


/* =========================================================
   HTML描画
========================================================= */

function render(html) {
  document.getElementById("app").innerHTML = `
    <div class="card">
      ${html}
    </div>
  `;
}


/* =========================================================
   スタート画面
========================================================= */

function showStart() {

  render(`
    <div class="start-title">
      しおり20歳の謎解き
    </div>

    <div class="start-subtitle">
      20歳の誕生日を記念して、<br>
      20個の謎を用意しました。<br><br>

      すべての謎を解き明かせ！
    </div>

    <button class="start-button" onclick="beginGame()">
      START
    </button>
  `);
}


/* =========================================================
   ゲーム開始
========================================================= */

function beginGame() {

  /*
    STARTを押したときだけゲーム開始。
    スタートページを開いただけではQ1へ進まない。
  */

  if (!localStorage.getItem("randomOrder")) {
    createRandomOrder();
  }

  startGame();
}


/* =========================================================
   ランダム順作成
========================================================= */

function createRandomOrder() {

  randomOrder = Object.keys(randomQuestions)
    .map(Number);

  for (let i = randomOrder.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [
      randomOrder[i],
      randomOrder[j]
    ] = [
      randomOrder[j],
      randomOrder[i]
    ];
  }

  localStorage.setItem(
    "randomOrder",
    JSON.stringify(randomOrder)
  );
}


/* =========================================================
   ランダム順取得
========================================================= */

function getRandomOrder() {

  const saved =
    localStorage.getItem("randomOrder");

  if (saved) {

    try {

      const parsed = JSON.parse(saved);

      if (
        Array.isArray(parsed) &&
        parsed.length === 12 &&
        parsed.every(
          n => randomQuestions[n]
        )
      ) {
        return parsed;
      }

    } catch (e) {}

  }

  createRandomOrder();

  return randomOrder;
}


/* =========================================================
   ゲーム再開
========================================================= */

function startGame() {

  if (!localStorage.getItem("clear01")) {
    showQuestion(1);
    return;
  }

  if (!localStorage.getItem("clear02")) {
    showQuestion(2);
    return;
  }

  if (!localStorage.getItem("clear03")) {
    showQuestion(3);
    return;
  }

  randomOrder = getRandomOrder();

  for (let i = 0; i < 12; i++) {

    const actualNumber =
      randomOrder[i];

    const key =
      "clear" +
      String(actualNumber).padStart(2, "0");

    if (!localStorage.getItem(key)) {

      randomPosition = i;

      showRandomQuestion();

      return;
    }
  }

  if (!localStorage.getItem("clear16")) {
    showQuestion(16);
    return;
  }

  if (!localStorage.getItem("clear17")) {
    showQuestion(17);
    return;
  }

  if (!localStorage.getItem("clear18")) {
    showQuestion(18);
    return;
  }

  if (!localStorage.getItem("clear19")) {
    showQuestion(19);
    return;
  }

  if (!localStorage.getItem("clear20")) {
    showQuestion(20);
    return;
  }

  showClear();
}


/* =========================================================
   通常問題
========================================================= */

function showQuestion(number) {

  const q =
    fixedQuestions[number];

  let images = "";

  q.images.forEach(src => {

    images += `
      <img
        src="${src}"
        class="question-image"
      >
    `;

  });

  render(`

    <div class="question-number">
      Q${number}
    </div>

    ${images}

    <div class="question-text">
      ${q.text}
    </div>

    <div class="answer-area">

      <input
        id="answer"
        class="answer-input"
        type="text"
        autocomplete="off"
        placeholder="答えを入力"
      >

      <button
        class="answer-button"
        onclick="checkAnswer(${number})"
      >
        回答する
      </button>

      <div id="result"></div>

    </div>
  `);
}


/* =========================================================
   通常問題の回答
========================================================= */

function checkAnswer(number) {

  const input =
    document.getElementById("answer");

  const answer =
    input.value.trim();

  const q =
    fixedQuestions[number];

  const correct =
    q.answers.some(
      a => a.toLowerCase() === answer.toLowerCase()
    );

  const result =
    document.getElementById("result");

  if (correct) {

    localStorage.setItem(
      "clear" +
      String(number).padStart(2, "0"),
      "true"
    );

    result.innerHTML = `
      <div class="result correct">
        正解！
      </div>

      <button
        class="next-button"
        onclick="nextFixedQuestion(${number})"
      >
        NEXT
      </button>
    `;

  } else {

    result.innerHTML = `
      <div class="result wrong">
        不正解！
      </div>
    `;

  }
}


/* =========================================================
   通常問題NEXT
========================================================= */

function nextFixedQuestion(number) {

  if (number === 1) {
    showQuestion(2);
    return;
  }

  if (number === 2) {
    showQuestion(3);
    return;
  }

  if (number === 3) {

    randomOrder = getRandomOrder();
    randomPosition = 0;

    showRandomQuestion();

    return;
  }

  if (number === 16) {
    showHotel();
    return;
  }

  if (number === 17) {
    showQuestion(18);
    return;
  }

  if (number === 18) {
    showQuestion(19);
    return;
  }

  if (number === 19) {
    showQuestion(20);
    return;
  }

  if (number === 20) {
    showClear();
    return;
  }
}


/* =========================================================
   ランダム問題表示
========================================================= */

function showRandomQuestion() {

  randomOrder = getRandomOrder();

  const actualNumber =
    randomOrder[randomPosition];

  const displayedNumber =
    randomPosition + 4;

  const q =
    randomQuestions[actualNumber];

  let images = "";

  q.images.forEach(src => {

    images += `
      <img
        src="${src}"
        class="question-image"
      >
    `;

  });


  render(`

    <div class="question-number">
      Q${displayedNumber}
    </div>

    ${images}

    <div class="question-text">
      ${q.text}
    </div>

    <div class="answer-area">

      <input
        id="randomAnswer"
        class="answer-input"
        type="text"
        autocomplete="off"
        placeholder="答えを入力"
      >

      <button
        class="answer-button"
        onclick="checkRandomAnswer()"
      >
        回答する
      </button>

      <div id="randomResult"></div>

    </div>

  `);
}


/* =========================================================
   ランダム問題回答
========================================================= */

function checkRandomAnswer() {

  const input =
    document.getElementById("randomAnswer");

  const answer =
    input.value.trim();

  const actualNumber =
    randomOrder[randomPosition];

  const q =
    randomQuestions[actualNumber];

  const correct =
    q.answers.some(
      a => a.toLowerCase() === answer.toLowerCase()
    );

  const result =
    document.getElementById("randomResult");


  /*
    ここが重要。

    不正解の場合はNEXTを一切生成しない。
    正解したときだけNEXTを生成する。
  */

  if (!correct) {

    result.innerHTML = `
      <div class="result wrong">
        不正解！
      </div>
    `;

    return;
  }


  /*
    正解したら、その「元問題番号」をクリア済みにする。
  */

  localStorage.setItem(
    "clear" +
    String(actualNumber).padStart(2, "0"),
    "true"
  );


  result.innerHTML = `
    <div class="result correct">
      正解！
    </div>

    <button
      class="next-button"
      onclick="nextRandomQuestion()"
    >
      NEXT
    </button>
  `;
}


/* =========================================================
   ランダム問題NEXT
========================================================= */

function nextRandomQuestion() {

  /*
    正解していない問題からNEXTを押せないように、
    ここでもクリア状態を再確認する。
  */

  const actualNumber =
    randomOrder[randomPosition];

  const key =
    "clear" +
    String(actualNumber).padStart(2, "0");

  if (!localStorage.getItem(key)) {
    return;
  }


  randomPosition++;


  if (randomPosition < 12) {

    showRandomQuestion();

    return;
  }


  /*
    Q4〜Q15を全部終えたらQ16へ。
  */

  showQuestion(16);
}


/* =========================================================
   ホテル
========================================================= */

function showHotel() {

  render(`

    <div class="hotel-title">
      おつかれさま！
    </div>

    <div class="hotel-text">

      街ブラ謎解きはここまで！<br><br>

      椿森ホテルを予約してあります。<br><br>

      ここからは少し休憩して、<br>
      楽しい時間とご飯をゆっくり楽しもう！<br><br>

      まだまだ20歳の誕生日は終わりません。

    </div>

    <button
      class="next-button"
      onclick="showQuestion(17)"
    >
      NEXT
    </button>

  `);
}


/* =========================================================
   CLEAR画面
========================================================= */

function showClear() {

  render(`

    <div class="clear-title">

      20個の謎<br>
      撃破！<br><br>

      20歳！<br><br>

      HAPPY BIRTHDAY！

    </div>

    <div class="clear-message">

      誕生日おめでとう！<br><br>

      ここまでの20個の謎、<br>
      すべてクリア！<br><br>

      20歳の一年が、<br>
      たくさんの笑顔と<br>
      たくさんの思い出で<br>
      いっぱいになりますように。<br><br>

      これからもよろしくね。

    </div>

    <button
      class="reset-button"
      onclick="resetGame()"
    >
      最初からやり直す
    </button>

  `);
}


/* =========================================================
   最初からやり直す
========================================================= */

function resetGame() {

  for (let i = 1; i <= 20; i++) {

    localStorage.removeItem(
      "clear" +
      String(i).padStart(2, "0")
    );

  }

  /*
    ランダム順も消す。
    次回STARTしたときに新しい順番になる。
  */

  localStorage.removeItem("randomOrder");

  randomOrder = [];
  randomPosition = 0;


  /*
    Q1ではなく、
    必ずスタート画面へ戻る。
  */

  showStart();
}


/* =========================================================
   ページを開いた瞬間
========================================================= */

/*
  ここは絶対に startGame() にしない。

  start.htmlを開いたら、
  必ず最初にスタート画面を表示する。
*/

showStart();

</script>

</body>
</html>
