<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUESTION 02</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 20px;
}

.question-number {
    font-size: 18px;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

img {
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 0 auto 30px auto;
    border-radius: 10px;
}

input {
    width: 80%;
    max-width: 400px;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    text-align: center;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
}

#result {
    margin-top: 20px;
    font-size: 18px;
}

.clear {
    font-size: 30px;
    font-weight: bold;
    margin-top: 30px;
}

.next {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 30px;
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
}

.prev {
    display: inline-block;
    margin-top: 30px;
    margin-right: 10px;
    padding: 14px 30px;
    background: #555;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<div class="question-number">
QUESTION 02 / 20
</div>

<img src="IMG_8208.jpeg" alt="">

<div id="questionArea">

<input type="text" id="answer" placeholder="答えを入力">

<br>

<button type="button" onclick="checkAnswer()">回答する</button>

<div id="result"></div>

</div>

<div id="clearArea" style="display:none;">

<div class="clear">
QUESTION 02 CLEAR!
</div>

<a class="prev" href="index.html">← PREV</a>

<a class="next" href="question03.html">NEXT →</a>

</div>

</div>

<script>

function showClear() {
    document.getElementById("questionArea").style.display = "none";
    document.getElementById("clearArea").style.display = "block";
}

function checkAnswer() {

    const answer = document.getElementById("answer").value.trim();

    if (
        answer === "6" ||
        answer === "６" ||
        answer === "6個" ||
        answer === "６個"
    ) {

        localStorage.setItem("clear02", "true");

        showClear();

    } else {

        document.getElementById("result").textContent =
            "不正解！もう一度考えてみよう。";
    }
}

window.onload = function() {

    if (localStorage.getItem("clear02") === "true") {
        showClear();
    }

};

</script>

</body>
</html>
