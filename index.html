<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIORI 20th BIRTHDAY</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px 16px 60px;
      background: #fffafc;
      color: #222;
    }

    .question {
      max-width: 600px;
      margin: auto;
    }

    .number {
      font-size: 14px;
      letter-spacing: 2px;
      color: #777;
    }

    h1 {
      margin-bottom: 5px;
    }

    img {
      width: 100%;
      margin: 8px 0;
      border-radius: 12px;
    }

    .puzzle {
      font-size: 28px;
      margin: 30px 0;
      font-weight: bold;
    }

    input {
      width: 80%;
      max-width: 350px;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      display: block;
      margin: 15px auto;
      padding: 13px 35px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      line-height: 1.8;
      font-weight: bold;
    }

    .next {
      display: none;
      margin-top: 25px;
    }

    .next button {
      background: #555;
    }

  </style>
</head>

<body>

  <div class="question">

    <p class="number">QUESTION 01 / 20</p>

    <h1>最初の謎</h1>

    <p>3枚の画像をよく見て、答えを導き出せ。</p>

    <img src="IMG_8113.jpeg">
    <img src="IMG_8114.jpeg">
    <img src="IMG_8115.jpeg">

    <div class="puzzle">
      ①②⑤⑧ ＝ ？？？
    </div>

    <input id="answer" type="text" placeholder="答えを入力">

    <button onclick="checkAnswer()">ANSWER</button>

    <p id="result"></p>

    <div id="next" class="next">
      <button onclick="goNext()">NEXT →</button>
    </div>

  </div>

  <script>

    function checkAnswer() {

      const answer =
        document.getElementById("answer").value.trim();

      if (
        answer === "千葉公園" ||
        answer === "ちばこうえん"
      ) {

        document.getElementById("result").innerHTML =
          "QUESTION 01 CLEAR!<br><br>千葉公園へ向かえ。";

        document.getElementById("next").style.display = "block";

      } else {

        document.getElementById("result").textContent =
          "不正解。もう一度考えてみよう。";

        document.getElementById("next").style.display = "none";
      }
    }

    function goNext() {
      window.location.href = "question02.html";
    }

  </script>

</body>
</html>
