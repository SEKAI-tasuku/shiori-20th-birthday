<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAPPY BIRTHDAY!</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px 15px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 30px;
      margin: 10px 0 30px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
      margin: 8px 0;
    }

    .message {
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .nav {
      margin-top: 30px;
    }

    .nav a {
      display: block;
      color: white;
      text-decoration: none;
      border: 1px solid white;
      padding: 12px 20px;
      border-radius: 5px;
      max-width: 250px;
      margin: 0 auto;
    }

    .reset-button {
      margin-top: 25px;
      padding: 12px 25px;
      font-size: 16px;
      color: white;
      background: #111;
      border: 1px solid #777;
      border-radius: 5px;
      cursor: pointer;
    }

    .reset-button:hover {
      background: white;
      color: #111;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>20個の謎</h1>

  <h2>撃破！</h2>

  <h2>20歳！</h2>

  <h1>HAPPY BIRTHDAY！</h1>

  <p>誕生日おめでとう！</p>

  <div class="message">
    <p>ここまでの20個の謎、</p>
    <p>すべてクリア！</p>
    <p>20歳の一年が、</p>
    <p>たくさんの笑顔と</p>
    <p>たくさんの思い出で</p>
    <p>いっぱいになりますように。</p>
    <p>これからもよろしくね。</p>
  </div>

  <div class="nav">
    <a href="question20.html">PREV</a>
  </div>

  <button onclick="resetGame()" class="reset-button">
    最初からやり直す
  </button>

</div>

<script>
  function resetGame() {
    for (let i = 1; i <= 20; i++) {
      localStorage.removeItem(
        "clear" + String(i).padStart(2, "0")
      );
    }

    location.href = "start.html";
  }
</script>

</body>
</html>
